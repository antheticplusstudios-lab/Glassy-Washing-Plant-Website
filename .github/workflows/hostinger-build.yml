name: Verify Hostinger production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production server and prepare Hostinger entry points
        run: npm run build

      - name: Verify deployable files
        run: |
          test -s .output/server/index.mjs
          test -s .output/index.mjs
          test -s index.mjs
          node --check .output/server/index.mjs
          node --check .output/index.mjs
          node --check index.mjs

      - name: Smoke test production HTTP server
        env:
          # Isolated test credentials: the app's Supabase client requires config
          # even though the homepage gracefully falls back if the CMS query fails.
          SUPABASE_URL: http://127.0.0.1:9
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_placeholder
          VITE_SUPABASE_URL: http://127.0.0.1:9
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_SITE_URL: https://glassywashing.com
        run: |
          PORT=3000 HOST=127.0.0.1 node index.mjs > /tmp/glassy-node-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          STATUS=""
          for attempt in $(seq 1 20); do
            STATUS="$(curl --connect-timeout 2 --max-time 5 --silent --show-error --output /tmp/glassy-home.html --write-out "%{http_code}" http://127.0.0.1:3000/ || true)"
            if [ "$STATUS" = "200" ]; then
              break
            fi
            # Retry startup connection failures, but don't spend the full loop
            # retrying a definite HTTP 4xx/5xx response.
            if [ -n "$STATUS" ] && [ "$STATUS" != "000" ]; then
              break
            fi
            sleep 1
          done
          if [ "$STATUS" != "200" ]; then
            echo "Homepage returned HTTP ${STATUS:-no-response}"
            cat /tmp/glassy-node-server.log
            head -c 4000 /tmp/glassy-home.html || true
            exit 1
          fi
          test -s /tmp/glassy-home.html
          ! grep -q "This page didn't load" /tmp/glassy-home.html
          grep -q "Glassy Washing Plant" /tmp/glassy-home.html
          cat /tmp/glassy-node-server.log
